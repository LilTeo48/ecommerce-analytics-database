name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ecommerce_analytics"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ecommerce_analytics

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ecommerce_analytics -f sql/01_schema.sql

      - name: Load seed data
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ecommerce_analytics -f sql/02_seed_data.sql

      - name: Run tests
        run: python -m pytest -v
